services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: yourhealth
      POSTGRES_PASSWORD: yourhealth
      POSTGRES_DB: yourhealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourhealth"]
      interval: 2s
      retries: 15

  s3:
    # S3-compatible object store (MinIO no longer publishes public images).
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./backend/s3-dev.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
