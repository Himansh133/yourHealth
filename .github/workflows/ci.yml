name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000
  COOKIE_SECURE: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector), Redis and S3, as in local development
        run: docker compose up -d --wait
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Migrations apply to an empty database and match the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  eval-extraction:
    # Plan 14.6: no database or LLM needed. Fails if F1 drops more than 2 points from the committed baseline,
    # or if any extracted value or document type is wrong.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ..
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Harness tests
        run: pytest -q ../eval/tests
      - name: Build the seeded dataset
        run: python -m eval.generator.build
      - name: Extraction on the test split
        run: python -m eval.runners.run_extraction --split test --stamp ci
      - name: Compare with the baseline
        run: python -m eval.runners.check_regression ../eval/results/ci_extraction_test.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-results
          path: eval/results/ci_extraction_test.*
